name: Continue Release Branch Decision

on:
  issue_comment:
    types: [created]

concurrency:
  group: release-branch-decision-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  continue-release-branch:
    if: >-
      ${{
        github.event.issue.pull_request == null &&
        startsWith(github.event.issue.title, 'Release branch decision required:') &&
        (github.event.comment.body == '/use-existing' ||
         github.event.comment.body == '/create-new' ||
         github.event.comment.body == '/cancel')
      }}
    runs-on: ubuntu-latest
    environment: NCAP-NONPROD

    steps:
      - name: Read decision
        id: decision
        env:
          COMMENT: ${{ github.event.comment.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail

          if [[ ! "$ISSUE_TITLE" =~ ^Release\ branch\ decision\ required:\ (release/[0-9]{6}_v([0-9]+)PSUP)$ ]]; then
            echo "ERROR: Invalid release decision issue title: $ISSUE_TITLE"
            exit 1
          fi

          echo "release_branch=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "decision=$COMMENT" >> "$GITHUB_OUTPUT"
          echo "Developer decision: $COMMENT"
          echo "Calculated release branch: ${BASH_REMATCH[1]}"

      - name: Read last deployed branch
        id: last-branch
        env:
          LAST_DEPLOYED_BRANCH: ${{ vars.NCAP_NONPROD_LAST_DEPLOYED_BRANCH }}
        run: |
          set -euo pipefail
          if [ -z "$LAST_DEPLOYED_BRANCH" ]; then
            echo "ERROR: NCAP_NONPROD_LAST_DEPLOYED_BRANCH is empty."
            exit 1
          fi
          echo "Last deployed branch: $LAST_DEPLOYED_BRANCH"
          echo "last_branch=$LAST_DEPLOYED_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Cancel decision
        if: ${{ steps.decision.outputs.decision == '/cancel' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Decision cancelled. No branch was created or modified."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
          echo "Decision cancelled. No branch was created or modified."

      - name: Checkout last deployed branch
        if: ${{ steps.decision.outputs.decision != '/cancel' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.last-branch.outputs.last_branch }}
          fetch-depth: 0

      - name: Select release and staging branches
        id: branches
        if: ${{ steps.decision.outputs.decision != '/cancel' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          DECISION: ${{ steps.decision.outputs.decision }}
          CALCULATED_RELEASE: ${{ steps.decision.outputs.release_branch }}
          CALCULATED_VERSION: ${{ steps.decision.outputs.version }}
        run: |
          set -euo pipefail
          DATE_PREFIX="${CALCULATED_RELEASE#release/}"
          DATE_PREFIX="${DATE_PREFIX%%_v*}"

          if [ "$DECISION" = "/use-existing" ]; then
            RELEASE_BRANCH="$CALCULATED_RELEASE"
            echo "Using existing release branch: $RELEASE_BRANCH"
          else
            NEXT_VERSION=$((10#$CALCULATED_VERSION + 1))
            while true; do
              RELEASE_BRANCH="release/${DATE_PREFIX}_v${NEXT_VERSION}PSUP"
              STAGING_BRANCH="staging/${DATE_PREFIX}_v${NEXT_VERSION}PSUP"

                if ! git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1 && \
                  ! git ls-remote --exit-code --heads origin "$STAGING_BRANCH" >/dev/null 2>&1; then
                break
              fi

              echo "Candidate already exists: $RELEASE_BRANCH"
              NEXT_VERSION=$((NEXT_VERSION + 1))
            done
            echo "Explicit /create-new selected. Creating: $RELEASE_BRANCH"
          fi

          STAGING_BRANCH="staging/${RELEASE_BRANCH#release/}"
          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "staging_branch=$STAGING_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create or preserve selected branches
        if: ${{ steps.decision.outputs.decision != '/cancel' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          DECISION: ${{ steps.decision.outputs.decision }}
          RELEASE_BRANCH: ${{ steps.branches.outputs.release_branch }}
          STAGING_BRANCH: ${{ steps.branches.outputs.staging_branch }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse "origin/${{ steps.last-branch.outputs.last_branch }}")"
          echo "Source commit: $SOURCE_SHA"

          if [ "$DECISION" = "/use-existing" ]; then
            echo "Preserving existing release branch: $RELEASE_BRANCH"
          else
            git push origin "$SOURCE_SHA:refs/heads/$RELEASE_BRANCH"
            echo "Created release branch: $RELEASE_BRANCH"
          fi

          if ! git ls-remote --exit-code --heads origin "$STAGING_BRANCH" >/dev/null 2>&1; then
            git push origin "$SOURCE_SHA:refs/heads/$STAGING_BRANCH"
            echo "Created staging branch: $STAGING_BRANCH"
          else
            echo "Preserving existing staging branch: $STAGING_BRANCH"
          fi

          gh variable set NCAP_NONPROD_PENDING_RELEASE_BRANCH --env NCAP-NONPROD --body "$RELEASE_BRANCH"
          gh variable set NCAP_NONPROD_PENDING_RELEASE_CREATOR --env NCAP-NONPROD --body "@${{ github.event.comment.user.login }}"

      - name: Annotate README on staging branch
        if: ${{ steps.decision.outputs.decision != '/cancel' }}
        env:
          RELEASE_BRANCH: ${{ steps.branches.outputs.release_branch }}
          STAGING_BRANCH: ${{ steps.branches.outputs.staging_branch }}
          CREATOR: ${{ github.event.comment.user.login }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/$STAGING_BRANCH:refs/remotes/origin/$STAGING_BRANCH"
          git checkout -B "$STAGING_BRANCH" "origin/$STAGING_BRANCH"

          if ! grep -q '^| Date | Environment | Branch | Creator |' README.md 2>/dev/null; then
            printf "\n| Date | Environment | Branch | Creator |\n|---|---|---|---|\n" >> README.md
          fi
          printf "| %s | %s | %s | %s |\n" "$(date -u +'%Y-%m-%d %H:%M:%SZ')" "NCAP-NONPROD" "$STAGING_BRANCH" "$CREATOR" >> README.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: add deployment entry for $STAGING_BRANCH" || true
          git push origin "$STAGING_BRANCH"

      - name: Create staging to release PR
        if: ${{ steps.decision.outputs.decision != '/cancel' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          RELEASE_BRANCH: ${{ steps.branches.outputs.release_branch }}
          STAGING_BRANCH: ${{ steps.branches.outputs.staging_branch }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          BODY="Continuation approved by @${{ github.event.comment.user.login }}. Source: $STAGING_BRANCH. Target: $RELEASE_BRANCH."
          gh api --method POST "/repos/$GITHUB_REPOSITORY/pulls" \
            -f title="Merge $STAGING_BRANCH into $RELEASE_BRANCH" \
            -f head="$OWNER:$STAGING_BRANCH" \
            -f base="$RELEASE_BRANCH" \
            -f body="$BODY"

          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" \
            --body "Decision ${{ github.event.comment.body }} completed. Release: $RELEASE_BRANCH. Staging: $STAGING_BRANCH."
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY"
