name: Demo Deploy

on:
  workflow_dispatch:
    inputs:
      branch_to_deploy:
        description: "Branch to simulate deployment from"
        required: true
        default: "main"
        type: string

permissions:
  contents: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: NCAP-NONPROD

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_to_deploy }}
          fetch-depth: 0

      - name: Run Python application
        run: python src/app.py

      - name: Simulate deployment
        run: |
          echo "Simulating NCAP Non-Prod deployment"
          echo "Branch: ${{ inputs.branch_to_deploy }}"
          echo "Deployment completed successfully."

      - name: Update last deployed branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_BRANCH: ${{ inputs.branch_to_deploy }}
        run: |
          echo "Updating last deployed branch to: $DEPLOYED_BRANCH"

          gh variable set NCAP_NONPROD_LAST_DEPLOYED_BRANCH             --env NCAP-NONPROD             --body "$DEPLOYED_BRANCH"

          echo "Last deployed branch updated successfully."
