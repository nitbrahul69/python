name: Create Deployment Branch

on:
  workflow_dispatch:

concurrency:
  group: create-deployment-branch
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  create-branches-and-pr:
    runs-on: ubuntu-latest

    environment: NCAP-NONPROD

    steps:

      # ---------------------------------------------------
      # 1. Read last successfully deployed branch
      # ---------------------------------------------------
      - name: Read last deployed branch
        id: last-branch
        env:
          LAST_DEPLOYED_BRANCH: ${{ vars.NCAP_NONPROD_LAST_DEPLOYED_BRANCH }}
        run: |
          if [ -z "$LAST_DEPLOYED_BRANCH" ]; then
            echo "ERROR: NCAP_NONPROD_LAST_DEPLOYED_BRANCH is empty."
            echo "Run a successful deployment first."
            exit 1
          fi

          echo "Last deployed branch: $LAST_DEPLOYED_BRANCH"

          echo "last_branch=$LAST_DEPLOYED_BRANCH" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------
      # 2. Checkout last deployed branch
      # ---------------------------------------------------
      - name: Checkout last deployed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.last-branch.outputs.last_branch }}
          fetch-depth: 0


      # ---------------------------------------------------
      # 3. Generate and validate release branch
      # ---------------------------------------------------
      - name: Generate and validate release branch
        id: branch-names
        env:
          LAST_DEPLOYED_BRANCH: ${{ steps.last-branch.outputs.last_branch }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |

          # Expected format: release/mmddyy_v<version>PSUP
          if [[ ! "$LAST_DEPLOYED_BRANCH" =~ ^release/[0-9]{6}_v([0-9]+)PSUP$ ]]; then
            echo "ERROR: Last deployed branch '$LAST_DEPLOYED_BRANCH' does not match the expected format."
            echo "Expected format: release/mmddyy_v<version>PSUP"
            exit 1
          fi

          LAST_VERSION="${BASH_REMATCH[1]}"
          CALCULATED_VERSION=$((10#$LAST_VERSION + 1))
          DATE_PREFIX="$(date -u +'%m%d%y')"
          CALCULATED_RELEASE="release/${DATE_PREFIX}_v${CALCULATED_VERSION}PSUP"
          CALCULATED_STAGING="staging/${DATE_PREFIX}_v${CALCULATED_VERSION}PSUP"

          echo "Last deployed branch: $LAST_DEPLOYED_BRANCH"
          echo "Calculated next branch: $CALCULATED_RELEASE"

          RELEASE_EXISTS=false
          STAGING_EXISTS=false
          if git ls-remote --exit-code --heads origin "$CALCULATED_RELEASE" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi
          if git ls-remote --exit-code --heads origin "$CALCULATED_STAGING" >/dev/null 2>&1; then
            STAGING_EXISTS=true
          fi

          if [ "$RELEASE_EXISTS" = false ] && [ "$STAGING_EXISTS" = false ]; then
            RELEASE_BRANCH="$CALCULATED_RELEASE"
            STAGING_BRANCH="$CALCULATED_STAGING"
            echo "decision_required=false" >> "$GITHUB_OUTPUT"
            echo "Calculated release branch does not exist. Creating it."
          else
            echo "Calculated release branch already exists: $CALCULATED_RELEASE"
            NEW_VERSION=$((CALCULATED_VERSION + 1))
            NEXT_RELEASE="release/${DATE_PREFIX}_v${NEW_VERSION}PSUP"
            NEXT_STAGING="staging/${DATE_PREFIX}_v${NEW_VERSION}PSUP"
            ISSUE_TITLE="Release branch decision required: $CALCULATED_RELEASE"

            EXISTING_ISSUE="$(gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search "$ISSUE_TITLE in:title" \
              --json number \
              --jq '.[0].number' 2>/dev/null || true)"

            if [ -z "$EXISTING_ISSUE" ]; then
              ISSUE_BODY="$(printf '%s\n' \
                '⚠️ **Release Branch Already Exists**' \
                '' \
                'The calculated release branch is:' \
                '' \
                "**$CALCULATED_RELEASE**" \
                '' \
                'However, this branch already exists.' \
                '' \
                'Please choose what you want to do by commenting one of these commands on this issue:' \
                '' \
                '1. **/use-existing** — use the existing release branch.' \
                "2. **/create-new** — create exactly **$NEXT_RELEASE**." \
                '3. **/cancel** — stop without creating a new branch.' \
                '' \
                "Existing staging branch: **$CALCULATED_STAGING**" \
                "Next staging branch if approved: **$NEXT_STAGING**" \
                '' \
                'The workflow stopped before modifying either existing branch.')"

              ISSUE_URL="$(gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body "$ISSUE_BODY")"
              echo "Confirmation issue created: $ISSUE_URL"
            else
              echo "An open confirmation issue already exists: https://github.com/$GITHUB_REPOSITORY/issues/$EXISTING_ISSUE"
            fi

            echo "No branch was created. A developer must comment /use-existing, /create-new, or /cancel on the issue."
            echo "decision_required=true" >> "$GITHUB_OUTPUT"
            echo "Branch creation paused. Confirmation is required. See the linked GitHub Issue."
            exit 0
          fi

          echo "Final release branch: $RELEASE_BRANCH"
          echo "Final staging branch: $STAGING_BRANCH"

          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "staging_branch=$STAGING_BRANCH" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------
      # 4. Create Release and Staging branches
      # ---------------------------------------------------
      - name: Create release and staging branches
        if: ${{ steps.branch-names.outputs.decision_required != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          RELEASE_BRANCH: ${{ steps.branch-names.outputs.release_branch }}
          STAGING_BRANCH: ${{ steps.branch-names.outputs.staging_branch }}
        run: |

          LAST_BRANCH="${{ steps.last-branch.outputs.last_branch }}"

          echo "=========================================="
          echo "Source branch  : $LAST_BRANCH"
          echo "Release branch : $RELEASE_BRANCH"
          echo "Staging branch : $STAGING_BRANCH"
          echo "=========================================="

          SOURCE_SHA="$(git rev-parse "origin/$LAST_BRANCH")"
          echo "Source commit   : $SOURCE_SHA"

          if ! git push origin "$SOURCE_SHA:refs/heads/$RELEASE_BRANCH"; then
            echo "ERROR: Could not create release branch '$RELEASE_BRANCH'."
            echo "The branch may have been created concurrently or the token lacks contents:write permission."
            exit 1
          fi

          echo "Release branch ready: $RELEASE_BRANCH"

          if ! git push origin "$SOURCE_SHA:refs/heads/$STAGING_BRANCH"; then
            echo "ERROR: Could not create staging branch '$STAGING_BRANCH'."
            echo "The branch may have been created concurrently or the token lacks contents:write permission."
            exit 1
          fi

          echo "Staging branch ready: $STAGING_BRANCH"

          gh variable set NCAP_NONPROD_PENDING_RELEASE_BRANCH \
            --env NCAP-NONPROD --body "$RELEASE_BRANCH"
          gh variable set NCAP_NONPROD_PENDING_RELEASE_CREATOR \
            --env NCAP-NONPROD --body "@$GITHUB_ACTOR"


      # ---------------------------------------------------
      # 5. Annotate README on Staging branch to create a commit
      # ---------------------------------------------------
      - name: Annotate README on staging branch
        if: ${{ steps.branch-names.outputs.decision_required != 'true' }}
        env:
          RELEASE_BRANCH: ${{ steps.branch-names.outputs.release_branch }}
          STAGING_BRANCH: ${{ steps.branch-names.outputs.staging_branch }}
          CREATOR: ${{ github.actor }}
          ENVIRONMENT: NCAP-NONPROD
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |

          echo "Annotating README on $STAGING_BRANCH to ensure PR has changes..."

          git fetch origin "+refs/heads/$STAGING_BRANCH:refs/remotes/origin/$STAGING_BRANCH"
          git checkout -B "$STAGING_BRANCH" "origin/$STAGING_BRANCH"

          README=README.md

          # Add table header if missing
          if ! grep -q '^| Date | Environment | Branch | Creator |' "$README" 2>/dev/null; then
            printf "\n| Date | Environment | Branch | Creator |\n|---|---|---|---|\n" >> "$README"
          fi

          DATE="$(date -u +'%Y-%m-%d %H:%M:%SZ')"

          printf "| %s | %s | %s | %s |\n" "$DATE" "$ENVIRONMENT" "$STAGING_BRANCH" "$CREATOR" >> "$README"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$README"
          git commit -m "chore: add deployment entry for $STAGING_BRANCH" || echo "No changes to commit"
          git push origin "$STAGING_BRANCH"


      # ---------------------------------------------------
      # 6. Create Staging -> Release Pull Request
      # ---------------------------------------------------
      - name: Create staging to release PR
        if: ${{ steps.branch-names.outputs.decision_required != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          RELEASE_BRANCH: ${{ steps.branch-names.outputs.release_branch }}
          STAGING_BRANCH: ${{ steps.branch-names.outputs.staging_branch }}
        run: |

          echo "Creating Pull Request..."

          echo "Source : $STAGING_BRANCH"
          echo "Target : $RELEASE_BRANCH"
          echo "Source ref: refs/heads/$STAGING_BRANCH"
          echo "Target ref: refs/heads/$RELEASE_BRANCH"

          if [[ "$RELEASE_BRANCH" != release/* ]]; then
            echo "ERROR: Invalid release PR target: '$RELEASE_BRANCH'"
            exit 1
          fi

          if [[ "$STAGING_BRANCH" != staging/* ]]; then
            echo "ERROR: Invalid staging PR source: '$STAGING_BRANCH'"
            exit 1
          fi

          if [ "$RELEASE_BRANCH" = "main" ] || [ "$RELEASE_BRANCH" = "master" ]; then
            echo "ERROR: Refusing to create a pull request targeting '$RELEASE_BRANCH'."
            exit 1
          fi

          if ! git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "ERROR: Release target branch '$RELEASE_BRANCH' does not exist."
            exit 1
          fi

          if ! git ls-remote --exit-code --heads origin "$STAGING_BRANCH" >/dev/null 2>&1; then
            echo "ERROR: Staging source branch '$STAGING_BRANCH' does not exist."
            exit 1
          fi

          PR_BODY="Automated Pull Request created for deployment preparation.

          Source Branch:
          $STAGING_BRANCH

          Target Branch:
          $RELEASE_BRANCH

          Last Deployed Branch:
          ${{ steps.last-branch.outputs.last_branch }}"

          REPOSITORY_OWNER="${GITHUB_REPOSITORY%%/*}"
          PR_TITLE="Merge $STAGING_BRANCH into $RELEASE_BRANCH"

          echo "Creating PR with explicit values:"
          echo "  head: $REPOSITORY_OWNER:$STAGING_BRANCH"
          echo "  base: $RELEASE_BRANCH"

          # Use the REST API so both refs are sent explicitly. This prevents
          # the CLI or repository default branch from becoming the PR target.
          PR_RESPONSE="$(gh api \
            --method POST \
            "/repos/$GITHUB_REPOSITORY/pulls" \
            -f title="$PR_TITLE" \
            -f head="$REPOSITORY_OWNER:$STAGING_BRANCH" \
            -f base="$RELEASE_BRANCH" \
            -f body="$PR_BODY")"

          CREATED_BASE="$(printf '%s' "$PR_RESPONSE" | jq -r '.base.ref')"
          CREATED_HEAD="$(printf '%s' "$PR_RESPONSE" | jq -r '.head.ref')"
          CREATED_URL="$(printf '%s' "$PR_RESPONSE" | jq -r '.html_url')"

          if [ "$CREATED_BASE" != "$RELEASE_BRANCH" ] || [ "$CREATED_HEAD" != "$STAGING_BRANCH" ]; then
            echo "ERROR: Pull request refs do not match the requested branches."
            echo "Created base: $CREATED_BASE"
            echo "Created head: $CREATED_HEAD"
            echo "Requested base: $RELEASE_BRANCH"
            echo "Requested head: $STAGING_BRANCH"
            exit 1
          fi

          echo "Pull Request created successfully: $CREATED_URL"
