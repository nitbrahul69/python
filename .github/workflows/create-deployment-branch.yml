name: Create Deployment Branch

on:
  workflow_dispatch:
    inputs:
      new_branch:
        description: "New deployment branch name"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    environment: NCAP-NONPROD

    steps:
      - name: Read last deployed branch
        id: last-branch
        env:
          LAST_DEPLOYED_BRANCH: ${{ vars.NCAP_NONPROD_LAST_DEPLOYED_BRANCH }}
        run: |
          if [ -z "$LAST_DEPLOYED_BRANCH" ]; then
            echo "ERROR: NCAP_NONPROD_LAST_DEPLOYED_BRANCH is empty."
            echo "Run Demo Deploy successfully first."
            exit 1
          fi

          echo "Last deployed branch: $LAST_DEPLOYED_BRANCH"
          echo "last_branch=$LAST_DEPLOYED_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout last deployed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.last-branch.outputs.last_branch }}
          fetch-depth: 0

      - name: Validate new branch
        env:
          NEW_BRANCH: ${{ inputs.new_branch }}
        run: |
          if [ -z "$NEW_BRANCH" ]; then
            echo "ERROR: New branch name is empty."
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "$NEW_BRANCH" >/dev/null 2>&1; then
            echo "ERROR: Branch '$NEW_BRANCH' already exists."
            exit 1
          fi

      - name: Create and push deployment branch
        env:
          NEW_BRANCH: ${{ inputs.new_branch }}
        run: |
          LAST_BRANCH="${{ steps.last-branch.outputs.last_branch }}"

          echo "Source branch: $LAST_BRANCH"
          echo "New branch: $NEW_BRANCH"

          git checkout -b "$NEW_BRANCH"
          git push origin "$NEW_BRANCH"

          echo "Deployment branch created successfully."
