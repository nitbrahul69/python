name: Create Deployment Branch

on:
  workflow_dispatch:
    inputs:
      new_branch:
        description: "New deployment branch name"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    environment: NCAP-NONPROD

    steps:
      - name: Read last deployed branch
        id: last-branch
        run: |
          LAST_BRANCH="${{ vars.NCAP_NONPROD_LAST_DEPLOYED_BRANCH }}"

          if [ -z "$LAST_BRANCH" ]; then
            echo "ERROR: NCAP_NONPROD_LAST_DEPLOYED_BRANCH is empty."
            echo "Run the Demo Deploy workflow successfully first."
            exit 1
          fi

          echo "Last deployed branch: $LAST_BRANCH"
          echo "last_branch=$LAST_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout last deployed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.last-branch.outputs.last_branch }}
          fetch-depth: 0

      - name: Create new deployment branch
        env:
          NEW_BRANCH: ${{ inputs.new_branch }}
        run: |
          LAST_BRANCH="${{ steps.last-branch.outputs.last_branch }}"

          echo "Creating new branch: $NEW_BRANCH"
          echo "Branch source: $LAST_BRANCH"

          git checkout -b "$NEW_BRANCH"
          git push origin "$NEW_BRANCH"

          echo "----------------------------------------"
          echo "New deployment branch created successfully."
          echo "Source branch : $LAST_BRANCH"
          echo "New branch    : $NEW_BRANCH"
          echo "----------------------------------------"
