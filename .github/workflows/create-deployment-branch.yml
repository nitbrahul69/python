name: Create Deployment Branch

on:
  workflow_dispatch:
    inputs:
      new_branch:
        description: "New release branch name"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-branches-and-pr:
    runs-on: ubuntu-latest

    environment: NCAP-NONPROD

    steps:

      # ---------------------------------------------------
      # 1. Read last successfully deployed branch
      # ---------------------------------------------------
      - name: Read last deployed branch
        id: last-branch
        env:
          LAST_DEPLOYED_BRANCH: ${{ vars.NCAP_NONPROD_LAST_DEPLOYED_BRANCH }}
        run: |
          if [ -z "$LAST_DEPLOYED_BRANCH" ]; then
            echo "ERROR: NCAP_NONPROD_LAST_DEPLOYED_BRANCH is empty."
            echo "Run a successful deployment first."
            exit 1
          fi

          echo "Last deployed branch: $LAST_DEPLOYED_BRANCH"

          echo "last_branch=$LAST_DEPLOYED_BRANCH" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------
      # 2. Checkout last deployed branch
      # ---------------------------------------------------
      - name: Checkout last deployed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.last-branch.outputs.last_branch }}
          fetch-depth: 0


      # ---------------------------------------------------
      # 3. Validate release branch
      # ---------------------------------------------------
      - name: Validate release branch
        env:
          RELEASE_BRANCH: ${{ inputs.new_branch }}
        run: |

          if [ -z "$RELEASE_BRANCH" ]; then
            echo "ERROR: Release branch name is empty."
            exit 1
          fi

          # Make sure release branch follows expected naming convention
          if [[ ! "$RELEASE_BRANCH" =~ ^release/ ]]; then
            echo "ERROR: Release branch must start with 'release/'."
            echo "Example: release/081726_v6PSUP"
            exit 1
          fi

          # Create staging branch name
          STAGING_BRANCH="staging/${RELEASE_BRANCH#release/}"

          echo "Release branch : $RELEASE_BRANCH"
          echo "Staging branch : $STAGING_BRANCH"

          # Check release branch already exists
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "ERROR: Release branch '$RELEASE_BRANCH' already exists."
            exit 1
          fi

          # Check staging branch already exists
          if git ls-remote --exit-code --heads origin "$STAGING_BRANCH" >/dev/null 2>&1; then
            echo "ERROR: Staging branch '$STAGING_BRANCH' already exists."
            exit 1
          fi


      # ---------------------------------------------------
      # 4. Create Release and Staging branches
      # ---------------------------------------------------
      - name: Create release and staging branches
        env:
          RELEASE_BRANCH: ${{ inputs.new_branch }}
        run: |

          LAST_BRANCH="${{ steps.last-branch.outputs.last_branch }}"

          STAGING_BRANCH="staging/${RELEASE_BRANCH#release/}"

          echo "=========================================="
          echo "Source branch  : $LAST_BRANCH"
          echo "Release branch : $RELEASE_BRANCH"
          echo "Staging branch : $STAGING_BRANCH"
          echo "=========================================="

          # ---------------------------------------------
          # Create Release Branch
          # ---------------------------------------------
          git checkout "$LAST_BRANCH"

          git checkout -b "$RELEASE_BRANCH"

          git push origin "$RELEASE_BRANCH"

          echo "Release branch created successfully."


          # ---------------------------------------------
          # Create Staging Branch
          # ---------------------------------------------
          git checkout "$LAST_BRANCH"

          git checkout -b "$STAGING_BRANCH"

          git push origin "$STAGING_BRANCH"

          echo "Staging branch created successfully."


      # ---------------------------------------------------
      # 5. Annotate README on Staging branch to create a commit
      # ---------------------------------------------------
      - name: Annotate README on staging branch
        env:
          RELEASE_BRANCH: ${{ inputs.new_branch }}
          CREATOR: ${{ github.actor }}
          ENVIRONMENT: NCAP-NONPROD
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |

          STAGING_BRANCH="staging/${RELEASE_BRANCH#release/}"

          echo "Annotating README on $STAGING_BRANCH to ensure PR has changes..."

          git fetch origin
          git checkout "$STAGING_BRANCH"

          README=README.md

          # Add table header if missing
          if ! grep -q '^| Date | Environment | Branch | Creator |' "$README" 2>/dev/null; then
            printf "\n| Date | Environment | Branch | Creator |\n|---|---|---|---|\n" >> "$README"
          fi

          DATE="$(date -u +'%Y-%m-%d %H:%M:%SZ')"

          printf "| %s | %s | %s | %s |\n" "$DATE" "$ENVIRONMENT" "$STAGING_BRANCH" "$CREATOR" >> "$README"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$README"
          git commit -m "chore: add deployment entry for $STAGING_BRANCH" || echo "No changes to commit"
          git push origin "$STAGING_BRANCH"


      # ---------------------------------------------------
      # 6. Create Staging -> Release Pull Request
      # ---------------------------------------------------
      - name: Create staging to release PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RELEASE_BRANCH: ${{ inputs.new_branch }}
        run: |

          STAGING_BRANCH="staging/${RELEASE_BRANCH#release/}"

          echo "Creating Pull Request..."

          echo "Source : $STAGING_BRANCH"
          echo "Target : $RELEASE_BRANCH"

          gh pr create \
            --base "$RELEASE_BRANCH" \
            --head "$STAGING_BRANCH" \
            --title "Merge $STAGING_BRANCH into $RELEASE_BRANCH" \
            --body "Automated Pull Request created for deployment preparation.

          Source Branch:
          $STAGING_BRANCH

          Target Branch:
          $RELEASE_BRANCH

          Last Deployed Branch:
          ${{ steps.last-branch.outputs.last_branch }}"

          echo "Pull Request created successfully."
